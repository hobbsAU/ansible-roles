---
# Main tasks file for samba role

- name: Install Samba packages
  ansible.builtin.apt:
    name: "{{ samba_packages }}"
    state: present
    update_cache: true
  become: true

- name: Ensure sambashare group exists
  ansible.builtin.group:
    name: sambashare
    state: present
  become: true

- name: Ensure Samba data directory exists
  ansible.builtin.file:
    path: "{{ samba_data_path }}"
    state: directory
    owner: "{{ samba_data_owner }}"
    group: "{{ samba_data_group }}"
    mode: "{{ samba_data_mode }}"
  become: true

- name: Deploy Samba configuration file
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: Restart samba

- name: Check if Samba user exists
  ansible.builtin.shell:
    cmd: "set -o pipefail && pdbedit -L | grep -q '^{{ samba_username }}:'"
    executable: /bin/bash
  register: samba_user_exists
  failed_when: false
  changed_when: false
  become: true

- name: Create Unix user for Samba
  ansible.builtin.user:
    name: "{{ samba_username }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    groups: sambashare
    append: true
  become: true
  when: samba_user_exists.rc != 0

- name: Set Samba password for user
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      (echo "{{ samba_password }}"; echo "{{ samba_password }}") | smbpasswd -a -s {{ samba_username }}
    executable: /bin/bash
  become: true
  when: samba_user_exists.rc != 0
  # Only runs when the user is absent, so it always creates the account
  changed_when: true
  no_log: true

- name: Enable Samba user
  ansible.builtin.command: "smbpasswd -e {{ samba_username }}"
  become: true
  when: samba_user_exists.rc != 0
  # Only runs when the user was just created, so it always enables it
  changed_when: true

- name: Ensure Samba services are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ samba_services }}"
  become: true

- name: Validate Samba configuration
  ansible.builtin.command: testparm -s
  register: testparm_output
  changed_when: false
  become: true
