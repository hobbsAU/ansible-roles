---
- name: "Update APT package cache ({{ ansible_facts['distribution'] }})"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  retries: 2
  delay: 5
  tags:
    - apt

- name: "APT autoremove ({{ ansible_facts['distribution'] }})"
  ansible.builtin.apt:
    autoremove: true
  retries: 2
  delay: 5
  tags:
    - apt

- name: "Upgrade APT to the latest packages ({{ ansible_facts['distribution'] }})"
  ansible.builtin.apt:
    upgrade: full
    autoremove: true
  retries: 2
  delay: 5
  tags:
    - apt

- name: Install wireguard
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
  become: true

- name: Setup wg0 config
  ansible.builtin.copy:
    src: "{{ wireguard_src_conf }}/{{ inventory_hostname }}/{{ wireguard_interface }}.conf"
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  become: true
  notify: Restart WireGuard

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true

- name: Set TCP congestion control to BBR
  ansible.posix.sysctl:
    name: net.ipv4.tcp_congestion_control
    value: "bbr"
    state: present
    reload: true

- name: Start and enable WireGuard service
  ansible.builtin.service:
    name: "wg-quick@{{ wireguard_interface }}"
    state: "{{ wireguard_service_state }}"
    enabled: "{{ wireguard_service_enabled }}"
