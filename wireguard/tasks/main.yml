---
- name: Install WireGuard
  ansible.builtin.import_tasks: install.yml
  tags: wireguard.install

- name: Setup interface and peers
  ansible.builtin.template:
    src: interface.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart wireguard
  tags: wireguard.config

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    reload: true
  tags: wireguard.config

- name: Update /etc/hosts
  ansible.builtin.lineinfile:
    dest: /etc/hosts
    regexp: "^{{ item.value.ip }}"
    line: "{{ item.value.ip }} {{ item.key }}"
  with_dict: "{{ wireguard_peers }}"
  tags: wireguard.config

- name: Enable and start WireGuard service
  ansible.builtin.service:
    name: "wg-quick@{{ wireguard_interface }}"
    state: stopped
    enabled: true
  register: result
  tags: wireguard.install

# Not a handler: the host must be back up before the rest of the play runs.
- name: Reboot # noqa: no-handler
  ansible.builtin.reboot:
  when: result is changed
