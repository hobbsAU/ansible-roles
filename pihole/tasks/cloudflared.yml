---
# file: roles/pihole/tasks/cloudflard.yml
# desc: Installs and configures cloudflared
#

- name: Register cloudflare binary
  ansible.builtin.stat:
    path: "{{ cloudflared_bin_location }}/cloudflared"
  register: cloudflared_binary

- name: Set fact cloudflare installed
  ansible.builtin.set_fact:
    cloudflared_installed: "{{ cloudflared_binary.stat.exists | default(false) }}"

- name: Set device architecture and package manager vars
  ansible.builtin.set_fact:
    device_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm' }}"

- name: Install package
  ansible.builtin.import_tasks: cfd_package.yml
  when: (not cloudflared_installed) and (ansible_pkg_mgr == 'yum' or ansible_pkg_mgr == 'apt') and (ansible_architecture == 'x86_64' or ansible_architecture ==
    'arm')

- name: Install binary
  ansible.builtin.import_tasks: cfd_binary.yml
  when: (not cloudflared_installed) and ((pkg_mgr_output is undefined or pkg_mgr_output is failed) or ansible_architecture == 'armv7l')

- name: Update cloudflare
  ansible.builtin.command: cloudflared update
  register: update_command
  changed_when: (update_command.rc in [11, 64])

- name: Template config file
  ansible.builtin.template:
    src: cloudflared.j2
    dest: /etc/default/cloudflared
    owner: nobody
    group: nogroup
    mode: "0644"
  notify: Restart cloudflared service
  tags: systemd

- name: Copy systemd service
  ansible.builtin.copy:
    src: cloudflared.service
    dest: /etc/systemd/system/
    owner: root
    group: root
    mode: "0644"
  notify: Restart cloudflared service
  register: service
  tags: systemd

# Not a handler: the unit must be enabled in the same run that installs it,
# before anything else in the play depends on cloudflared resolving DNS.
- name: Enable systemd service # noqa: no-handler
  ansible.builtin.service:
    name: cloudflared
    state: started
    enabled: "{{ cloudflared_enable_service }}"
  when: service is changed
  tags: systemd
