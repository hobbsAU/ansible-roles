---
- name: "Update APT package cache ({{ ansible_facts['distribution'] }})"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  retries: 2
  delay: 5
  tags:
    - apt

- name: "APT autoremove ({{ ansible_facts['distribution'] }})"
  ansible.builtin.apt:
    autoremove: true
  retries: 2
  delay: 5
  tags:
    - apt

- name: "Upgrade APT to the latest packages ({{ ansible_facts['distribution'] }})"
  ansible.builtin.apt:
    upgrade: full
    autoremove: true
  retries: 2
  delay: 5
  tags:
    - apt

# state: latest is the point of this task file
- name: Update wireguard # noqa: package-latest
  ansible.builtin.apt:
    name: wireguard-tools
    state: latest
  become: true
