---
# send test mail to admin
- name: Test mail
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo "Test mail from new/updated MSTMP at $(hostname)" \
        | mail root -s "Test SMTP $(hostname)"
    executable: /bin/bash
  # Sending mail is the whole point of this handler
  changed_when: true
  tags: mail
