---
# File: roles/msmtp/tasks/msmtp.yml
# Desc: installs and configures msmtp

- name: Ensure packages are installed
  ansible.builtin.apt:
    name: "{{ msmtp_packages }}"
    state: present
    update_cache: true
  notify: Test mail
  when: ansible_os_family == "Debian"

- name: Copy mstprc conf file
  ansible.builtin.template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    owner: root
    group: root
    mode: "0644"
  tags: mail
  notify: Test mail

- name: Copy aliases conf file
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  tags: mail
  notify: Test mail
