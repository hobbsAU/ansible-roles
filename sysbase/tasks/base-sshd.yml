---
# File: roles/base/tasks/sshd-config.yml
# Desc: Configures, tests and starts sshd

- name: Configure sshd
  ansible.builtin.template:
    src: sshd_secure.j2
    dest: "{{ base_sshd_config_basedir }}/sshd_config.d/sshd_secure.conf"
    owner: root
    group: root
    mode: "0400"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd
  tags: configuration

- name: Enable sshd
  ansible.builtin.service:
    name: "{{ base_sshd_service_name }}"
    state: started
    enabled: true
  tags: service
